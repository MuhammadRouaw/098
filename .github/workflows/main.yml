name: Android RDP Fast

on:
  workflow_dispatch:

jobs:
  secure-android-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-android-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              sleep 5
              RETRIES=$((RETRIES+1))
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Tailscale IP not assigned. Exiting."
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Start Performance-Optimized Redroid
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo modprobe ashmem_linux || true
          
          docker run -d --privileged \
            --name redroid \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=540 \
            androidboot.redroid_height=960 \
            androidboot.redroid_dpi=200 \
            androidboot.redroid_fps=30 \
            androidboot.redroid_gpu_mode=guest

      - name: Verify ADB, Disable Animations & Install Chrome
        run: |
          sudo apt-get install -y android-tools-adb wget
          echo "Waiting for Android container to boot..."
          sleep 12
          
          adb connect 127.0.0.1:5555
          
          # UI Optimization
          adb shell settings put global window_animation_scale 0.0 || true
          adb shell settings put global transition_animation_scale 0.0 || true
          adb shell settings put global animator_duration_scale 0.0 || true
          
          # Download & Install Chromium / Chrome APK
          echo "Downloading Chrome Browser APK..."
          wget -O chrome.apk "https://github.com/chromium/chromium/releases/download/114.0.5735.196/Chromium-114.0.5735.196-x86_64.apk" || wget -O chrome.apk "https://dl.google.com/android/repository/sys-img/android/x86-28_r04.zip" || true
          
          if [ -f chrome.apk ]; then
              adb install -r chrome.apk || echo "APK install failed, fallback to manual"
          fi
          
          echo "Setup complete!"

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== HIGH-SPEED ANDROID RDP INFO ==="
          echo "Tailscale IP : $TAILSCALE_IP"
          echo "ADB Port     : 5555"
          echo "Connect CMD  : adb connect $TAILSCALE_IP:5555"
          echo "===================================="
          echo ""
          
          while true; do
              echo "[$(date)] Android RDP Active"
              sleep 300
          done
